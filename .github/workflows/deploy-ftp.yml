name: Deploy to vhg.dk/floorball

# Samme mekanik som vhg-repoet: et push til main lægger siden op.
# Kræver hemmeligheden FTP_PASSWORD på dette repo (adgangskoden til
# allan@vhg.dk — den samme som vhg-repoet bruger).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sæt ?v=<hash> på css og js
        run: python stamp.py site

      - name: Deploy site/ til /public_html/floorball/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.vhg.dk
          username: allan@vhg.dk
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./site/
          server-dir: /public_html/floorball/
          # Denne action SYNKRONISERER — alt på serveren der ikke ligger i
          # site/ bliver slettet. api/data/ indeholder kommentardatabasen og
          # findes kun derovre, så den SKAL stå her.
          exclude: |
            **/.git*
            **/.git*/**
            api/data/**
            _*.html
